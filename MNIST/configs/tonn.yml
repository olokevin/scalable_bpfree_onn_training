GraSP:
  exp_name: "exp_7447_8448"
  depth: 2
  dataset: mnist
  resize: [28,28]
  device: 'cuda:0'
  # batch_size: 100
  # epoch: 1000
  batch_size: 2000
  epoch: 500
  learning_rate: 5e-4
  weight_decay: 1e-4
  fix_data: False
  seed: 42

pretrained:
  # incre: False 
  incre: True 
  # noise
  # load_model_path: /home
  # w/o noise
  load_model_path: /home
  pruned: False

model:
  network: tonn
  # mzi_noise: True
  mzi_noise: False
  in_features: 784 
  out_features: 10
  hidden_features: 1024
  num_layers: 2
  nonlinearity: 'relu'
  # shape_list: [[7,4,4,7], [8,4,4,8], [1,5,2,1]]
  shape_list: [[[7,4,4,7],[8,4,4,8]], [], [[8,4,4,8],[1,5,2,1]]]
  order: 4
  min_dim: 2
  factorization: 'ttm'
  rank: 6
  tensorize_first: True
  tensorize_last: True
  bias: True

ZO_Estim:
  ####### ZO_Estim_MC #######
  # en: False
  en: True
  name: ZO_Estim_MC
  sigma: 0.01
  n_sample: 10
  signsgd: False

  scale: null
  # scale: sqrt_dim
  # scale: dim

  actv_perturb_layer_list: null
  # actv_perturb_block_idx_list: all
  # actv_perturb_block_idx_list: [-2,]

  # param_perturb_param_list: null
  param_perturb_param_list: ['bias', 'weight']
  param_perturb_block_idx_list: all
  # param_perturb_block_idx_list: [8,]

  obj_fn_type: classifier
  # obj_fn_type: classifier_layerwise
  # obj_fn_type: pinn

  quantized: False

  en_layerwise_perturbation: True
  # en_layerwise_perturbation: False

  # en_partial_forward: True
  en_partial_forward: False

  # en_param_commit: False
  en_param_commit: True

  estimate_method: forward
  # estimate_method: antithetic

  # sample_method: uniform
  # sample_method: gaussian
  sample_method: bernoulli
  # sample_method: coord_basis

  normalize_perturbation: False
  # normalize_perturbation: True

optimizer:  
  debug: False

  name: adam
  betas: [0.9,0.5]

  # name: sgd
  # momentum: 0.9
  # weight_decay: 0

  # name: flops
  # sigma: 0.01
  # n_sample: 16

scheduler:
  name: 'steplr'
  epochs_til_decay: 100
  gamma: 0.8

# ONN
quantize:
  weight_bit: 8
  input_bit: 32
  v_pi: 4.36
  v_max: 10.8

noise:
  phase_noise_std: 0
  phase_bias: 1
  gamma_noise_std: 0.002
  crosstalk_factor: 0.005
  random_state: 42

ic: # identity calibration
  alg: zcd # [zgd, ztp, zcd]
  adaptive: 1
  best_record: 1

sl: # subspace learning
  noisy_identity: 0

onn_model:
  # mode: "usv"
  mode: "phase"
  act_thres: 2.0