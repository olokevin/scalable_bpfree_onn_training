GraSP:
  exp_name: "exp"
  depth: 2
  dataset: mnist
  resize: [28,28]
  device: 'cuda:0'
  batch_size: 2000
  epoch: 500
  learning_rate: 0.001
  weight_decay: 1e-4
  fix_data: False
  seed: 42
  
  exception: -1
  iterations: 1
  normalize: false
  # target_ratio: 0.005
  target_ratio: 1
  pruner_file: GraSP_zo_mask
  num_classes: 10
  samples_per_class: 10
  samples_batches: 5
  num_iters: 1
pretrained:
  incre: False
  load_model_path: 
  pruned: False

model:
  network: dnn
  in_features: 784 
  out_features: 10
  hidden_features: 1024
  # hidden_features: 10
  num_layers: 2
  nonlinearity: 'relu'
  nl_last_layer: false
  bias: True

ZO_Estim:
  ####### ZO_Estim_MC #######
  # en: False
  en: True
  name: ZO_Estim_MC
  sigma: 0.01
  n_sample: 10
  signsgd: False

  scale: null
  # scale: sqrt_dim
  # scale: dim

  actv_perturb_layer_list: null
  # actv_perturb_block_idx_list: all
  # actv_perturb_block_idx_list: [-2,]

  # param_perturb_param_list: null
  param_perturb_param_list: ['bias', 'weight']
  param_perturb_block_idx_list: all
  # param_perturb_block_idx_list: [8,]

  obj_fn_type: classifier
  # obj_fn_type: classifier_layerwise
  # obj_fn_type: pinn

  quantized: False

  en_layerwise_perturbation: True
  # en_layerwise_perturbation: False

  # en_partial_forward: True
  en_partial_forward: False

  en_param_commit: False
  # en_param_commit: True

  estimate_method: forward
  # estimate_method: antithetic

  # sample_method: uniform
  # sample_method: gaussian
  sample_method: bernoulli
  # sample_method: coord_basis

  normalize_perturbation: False
  # normalize_perturbation: True

optimizer:  
  # name: sgd
  # momentum: 0.9
  # weight_decay: 0
  
  name: adam
  betas: [0.9,0.5]

scheduler:
  name: 'steplr'
  epochs_til_decay: 100
  gamma: 0.8
